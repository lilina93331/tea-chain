<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d30"><title>茶序｜門市平台</title>
  <link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
<header><div class="wrap head"><a class="brand" href="/"><span class="mark">茶</span><span>茶序<small>CHA XU TEA HOUSE</small></span></a>
<button class="outline" id="account" hidden>店長登入</button></div></header>
<main class="wrap">
  <section class="hero"><div class="hero-copy"><p class="eyebrow" id="context">茶序 · 門市平台</p><h1 id="site-name">載入中…</h1></div><div class="landscape" aria-hidden="true"><i></i><b></b></div></section>
  <nav id="tabs" aria-label="工作區" hidden></nav>
  <div id="notice" role="status" aria-live="polite"></div>
  <section id="view" aria-live="polite"></section>
  <noscript>請開啟瀏覽器的 JavaScript，以載入菜單與營業資料。</noscript>
</main>
<footer class="wrap">茶序 <span>CHA XU TEA HOUSE</span></footer>
<dialog id="login"><form id="login-form"><p class="eyebrow">茶序 · 管理入口</p><h2 id="login-title">店長登入</h2>
<label>管理密碼<input id="password" type="password" autocomplete="current-password" required maxlength="200"></label>
<p id="login-error" role="alert"></p><div class="actions"><button type="button" class="outline" id="cancel">取消</button><button>登入</button></div></form></dialog>
</body></html>
